<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AZ KITCHEN</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #272727;
      background: #fff8f0;
    }

    header {
      padding: 2rem 1rem;
      text-align: center;
      color: white;
      background: #e85d24;
    }

    main {
      width: min(700px, 92%);
      margin: 2rem auto;
    }

    form, .menu-item {
      padding: 1.25rem;
      border-radius: 12px;
      background: white;
      box-shadow: 0 2px 10px #00000012;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .menu-item label { flex: 1; }
    .price { color: #555; }

    input[type="number"] { width: 65px; }

    .customer-details {
      display: grid;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    input, textarea, button {
      padding: 0.75rem;
      font: inherit;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    textarea { min-height: 80px; resize: vertical; }

    .total {
      margin: 1.5rem 0;
      font-size: 1.25rem;
      font-weight: bold;
    }

    button {
      width: 100%;
      color: white;
      background: #e85d24;
      border: 0;
      cursor: pointer;
    }

    button:hover { background: #c94b1c; }
  </style>
</head>
<body>
  <header>
    <h1>AZ KITCHEN</h1>
    <p>Fresh food, delivered to your door.</p>
  </header>

  <main>
    <form id="order-form">
      <h2>Choose your food</h2>
      <h3>The price is given according to servings</h3>

      <div class="menu-item">
        <input type="checkbox" id="spaghetti" data-price="800">
        <label for="burger">Spaghetti <span class="price">— 800</span></label>
        <input type="number" min="1" value="1" aria-label="Spaghetti quantity" disabled>
      </div>

      <div class="menu-item">
        <input type="checkbox" id="Rice" data-price="700">
        <label for="pizza">Rice <span class="price">— 700</span></label>
        <input type="number" min="1" value="1" aria-label="Pizza quantity" disabled>
      </div>

      <div class="menu-item">
        <input type="checkbox" id="salad" data-price="500">
        <label for="salad">Garden Salad <span class="price">— 500</span></label>
        <input type="number" min="1" value="1" aria-label="Salad quantity" disabled>
      </div>

      <div class="menu-item">
        <input type="checkbox" id="fries" data-price="600">
        <label for="fries">French Fries <span class="price">— 600</span></label>
        <input type="number" min="1" value="1" aria-label="Fries quantity" disabled>
      </div>

      <div class="customer-details">
        <h2>Your details</h2>
        <input type="text" name="name" placeholder="Your name" required>
        <input type="tel" name="phone" placeholder="Phone number" required>
        <textarea name="address" placeholder="Delivery address" required></textarea>
      </div>

      <p class="total">Total: <span id="total">0.00</span></p>
      <button type="submit">Place order</button>
      <h5>Built by <i>essentric_monsur</i> you can contact us at <a href="">whatsapp</a></h5>
    </form>
  </main>

  <script>
    const form = document.querySelector("#order-form");
    const totalDisplay = document.querySelector("#total");
    const items = document.querySelectorAll(".menu-item");

    function updateTotal() {
      let total = 0;

      items.forEach(item => {
        const checkbox = item.querySelector('input[type="checkbox"]');
        const quantity = item.querySelector('input[type="number"]');

        quantity.disabled = !checkbox.checked;
        if (checkbox.checked) {
          total += Number(checkbox.dataset.price) * Number(quantity.value || 1);
        }
      });

      totalDisplay.textContent = total.toFixed(2);
    }

    form.addEventListener("change", updateTotal);

    form.addEventListener("submit", event => {
      event.preventDefault();

      if (![...document.querySelectorAll('input[type="checkbox"]')]
        .some(item => item.checked)) {
        alert("Please select at least one food item.");
        return;
      }

      alert(`Thanks, ${form.elements.name.value}! Your order total is ${totalDisplay.textContent}.`);
      form.reset();
      updateTotal();
    });
  </script>
</body>
</html>
